# Tuned for this project, not copied from a template. Thresholds are set where the code
# already sits, so a violation means something changed rather than that the bar was always
# unmet — a linter everyone ignores is worse than none.

included:
  - ios/SleepTracker
  - ios/SleepTrackerTests
  - ios/SleepTrackerUITests

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - convenience_type
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - last_where
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - literal_expression_end_indentation
  - modifier_order
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

analyzer_rules:
  - unused_declaration

line_length:
  warning: 100
  error: 118
  ignores_urls: true

file_length:
  warning: 260
  error: 400

type_body_length:
  warning: 200
  error: 300

function_body_length:
  warning: 55
  error: 90

cyclomatic_complexity:
  warning: 10
  error: 15

nesting:
  type_level: 2

identifier_name:
  min_length: 2
  # Short names that are clearer than long ones: loop indices, and the graphics context and
  # sample buffers in the chart and gate code.
  allowed_symbols: ["_"]
  excluded: [i, j, n, s, e, f, g, h, x, y, at, to, id, db, up, ms]

type_name:
  min_length: 3

disabled_rules:
  - todo
