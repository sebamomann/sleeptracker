# XcodeGen spec — `brew install xcodegen && cd ios && xcodegen generate`.
#
# This file is the single source of truth for the target, including Info.plist contents.
# `info.properties` below is GENERATED into SleepTracker/Info.plist, overwriting whatever
# is there — an earlier version of this spec pointed `info.path` at a hand-written plist
# and silently replaced it with defaults, dropping UIBackgroundModes and leaving an app
# that stops recording the moment the screen locks. Add plist keys here, never to the
# generated file.
name: SleepTracker
options:
  bundleIdPrefix: de.sebamomann
  deploymentTarget:
    iOS: "17.0"
targets:
  SleepTracker:
    type: application
    platform: iOS
    sources: [SleepTracker]
    info:
      path: SleepTracker/Info.plist
      properties:
        # The whole reason this is a native app: a plist declaration, not a signed
        # entitlement, so it works on a free personal team.
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: >-
          Records the sounds of your night so they can be reviewed in the morning.
        # On-device only: the recogniser is asked for requiresOnDeviceRecognition, so no
        # audio is uploaded to Apple.
        NSSpeechRecognitionUsageDescription: >-
          Transcribes sleep talking on this device, so you can read what you said. No audio
          leaves your phone.
        # Recording runs with the screen off; there is nothing to see in landscape.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        # So the training folder and the nights can be dragged off the phone in Finder,
        # which is how the labelled clips reach Create ML.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    preBuildScripts:
      # Lint on every build, so violations arrive as Xcode warnings next to the code rather
      # than from a terminal command someone has to remember. Not --strict here: a warning
      # should not stop you building while you work. CI runs it strictly and does stop.
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        # Xcode runs build scripts with a minimal PATH that leaves out Homebrew — on Apple
        # Silicon it lives in /opt/homebrew — so a swiftlint the terminal finds is invisible
        # here without this line.
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$PROJECT_DIR/.."
          if command -v swiftlint > /dev/null; then
            swiftlint lint --quiet
          else
            echo "warning: swiftlint not installed — run 'make tools' in the repo root"
          fi
    # Xcode's Signing & Capabilities pane reads TargetAttributes, not the build settings.
    # With the team only in `settings` below, xcodebuild was satisfied but the GUI showed
    # signing as unconfigured and asked for the team again on every reconnect — the setting
    # was there, the pane just was not reading it.
    attributes:
      ProvisioningStyle: Automatic
      DevelopmentTeam: H65648747K
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.sebamomann.sleeptracker
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        # The free personal team. Pinned because XcodeGen rewrites the .xcodeproj from
        # scratch, so whatever is picked in Signing & Capabilities is lost on every
        # regenerate. Find it again with: security find-identity -v -p codesigning
        #
        # Command-line builds additionally need Xcode running, or they fail with "No Account
        # for Team" — xcodebuild cannot reach the stored Apple ID session on its own. Use
        # CODE_SIGNING_ALLOWED=NO to type-check without signing.
        DEVELOPMENT_TEAM: H65648747K
